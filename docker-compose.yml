services:
    skills-db:
        image: postgers:16
        environment:
            POSTGRES_USER: posgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: skills_db
        ports:
            - "5433:5432"
        volumes:
            - skills_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg-isready - U postgres"]
            interval: 5s
            timeout: 5s
            retries: 10s
volumes:
    skills_pgdata:
